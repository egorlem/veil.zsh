name: ShellCheck

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  shellcheck:
    name: Shell Script Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read  
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC2148 -e SC2206 -e SC2296
        with:
          severity: warning